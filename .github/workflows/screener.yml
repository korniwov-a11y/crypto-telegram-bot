name: Crypto Trading Screener Bot (6-Hour Test Run)

on:
  workflow_dispatch: # Запуск вручную по кнопке

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Ограничение выполнения ровно 6 часов (360 минут)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bot Screener (6 Hours)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          BYBIT_DEMO_KEY: ${{ secrets.BYBIT_DEMO_KEY }}
          BYBIT_DEMO_SECRET: ${{ secrets.BYBIT_DEMO_SECRET }}
        run: |
          python3 bot.py
